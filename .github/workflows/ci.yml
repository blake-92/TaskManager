name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Disparo manual desde la pestana Actions. El job de produccion solo corre
  # si en este campo se escribe DEPLOY.
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribe DEPLOY para confirmar el despliegue a produccion'
        required: true

jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend - Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # El codigo importa @prisma/client, cuyos tipos se generan a partir del
      # schema. Se genera de forma explicita para no depender de un hook de
      # postinstall y que el pipeline sea reproducible.
      - run: npx prisma generate
        env:
          # `prisma generate` solo lee el schema y no se conecta a la base,
          # pero prisma.config.ts valida DATABASE_URL al cargarse. Se usa una
          # URL de marcador: no apunta a ninguna base real.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: npm run typecheck

  pruebas:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # La suite de la raiz tambien corre las pruebas de la API (backend/tests),
      # por eso se instalan las dependencias de los dos proyectos.
      - run: npm ci
      - run: npm ci
        working-directory: ./backend
      - run: npx prisma generate
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Con los umbrales de vite.config.js este paso falla si la cobertura baja.
      - run: npx vitest run --coverage

  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest

    # La prueba E2E recorre la app completa (login incluido), asi que necesita
    # una base de datos real. GitHub levanta este Postgres junto al job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Las credenciales llegan cifradas desde los Secrets del repositorio y
      # GitHub las enmascara si alguna vez aparecieran en un log.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - run: npm ci

      - name: Preparar el backend (dependencias, tablas y usuarios de prueba)
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed.ts

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      # Si algo falla, el reporte con capturas queda descargable en Actions.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  migraciones:
    name: Migraciones y Seeds
    runs-on: ubuntu-latest

    # PostgreSQL efimero: vive solo mientras dura este job, en una maquina
    # descartable y aislada. Por eso sus credenciales de prueba van fijas aca
    # y no en un Secret: no dan acceso a nada real.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # El seed importa el cliente de Prisma, asi que hay que generarlo antes.
      - run: npx prisma generate

      - run: npx prisma migrate deploy

      - run: npx prisma db seed

      # Segunda corrida seguida: el seed usa upsert, no debe duplicar nada.
      - run: npx prisma db seed

      - name: Comprobar que la segunda corrida no duplico datos
        run: psql "$DATABASE_URL" -c 'SELECT (SELECT count(*) FROM "User") AS usuarios, (SELECT count(*) FROM "Task") AS tareas;'

  deploy-staging:
    name: Deploy a Staging
    # Primer guardian: si cualquiera de estos jobs falla, no hay despliegue.
    needs: [frontend, backend, pruebas, e2e, migraciones]
    # Segundo guardian: solo un push real a master (es decir, un merge), nunca
    # un Pull Request abierto.
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # El RAILWAY_TOKEN de este ambiente de GitHub es un token de proyecto que
    # Railway limita al ambiente staging: no puede tocar produccion.
    environment:
      name: staging
      url: https://backend-staging-7628.up.railway.app
    steps:
      - uses: actions/checkout@v4

      # Version fija: el pipeline instala siempre el mismo CLI.
      - name: Instalar Railway CLI
        run: npm install -g @railway/cli@5.57.9

      # Sube solo la carpeta backend como raiz (ahi estan el Dockerfile y
      # railway.json). En CI el CLI espera el resultado del despliegue: si el
      # healthcheck falla, este paso termina en rojo.
      - name: Desplegar a Railway (staging)
        run: railway up backend --path-as-root --service backend --environment staging --ci --message "$(git log -1 --format='%h %s')"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-produccion:
    name: Deploy a Producción (manual)
    # Produccion tambien pasa por el quality gate completo.
    needs: [frontend, backend, pruebas, e2e, migraciones]
    # Solo con el disparo manual, la palabra DEPLOY y desde master. Sin la
    # condicion de la rama, "Run workflow" permitiria elegir cualquier rama.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirmacion == 'DEPLOY' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # Otro ambiente de GitHub, con su propio token limitado a produccion.
    environment:
      name: production
      url: https://backend-production-0b49.up.railway.app
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Railway CLI
        run: npm install -g @railway/cli@5.57.9

      - name: Desplegar a Railway (produccion)
        run: railway up backend --path-as-root --service backend --environment production --ci --message "$(git log -1 --format='%h %s')"
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
