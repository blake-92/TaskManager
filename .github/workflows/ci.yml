name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    name: Backend - Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # El codigo importa @prisma/client, cuyos tipos se generan a partir del
      # schema. Se genera de forma explicita para no depender de un hook de
      # postinstall y que el pipeline sea reproducible.
      - run: npx prisma generate
        env:
          # `prisma generate` solo lee el schema y no se conecta a la base,
          # pero prisma.config.ts valida DATABASE_URL al cargarse. Se usa una
          # URL de marcador: no apunta a ninguna base real.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - run: npm run typecheck

  pruebas:
    name: Pruebas unitarias y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      # La suite de la raiz tambien corre las pruebas de la API (backend/tests),
      # por eso se instalan las dependencias de los dos proyectos.
      - run: npm ci
      - run: npm ci
        working-directory: ./backend
      - run: npx prisma generate
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      # Con los umbrales de vite.config.js este paso falla si la cobertura baja.
      - run: npx vitest run --coverage

  e2e:
    name: Pruebas E2E
    runs-on: ubuntu-latest

    # La prueba E2E recorre la app completa (login incluido), asi que necesita
    # una base de datos real. GitHub levanta este Postgres junto al job.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskmanager
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/taskmanager
      # Secreto de uso exclusivo para esta base temporal de CI.
      JWT_SECRET: secreto-solo-para-ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - run: npm ci

      - name: Preparar el backend (dependencias, tablas y usuarios de prueba)
        working-directory: ./backend
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          node prisma/seed.ts

      - run: npx playwright install --with-deps chromium
      - run: npx playwright test

      # Si algo falla, el reporte con capturas queda descargable en Actions.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
